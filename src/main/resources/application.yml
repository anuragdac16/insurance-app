server:
  port: 8080

spring:
  application:
    name: insurance-app

  # Local development defaults. Override with DB_URL, DB_USER, and DB_PASSWORD.
  # Flyway owns the schema: src/main/resources/db/migration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurancedb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

  # --- Kafka. Producer and consumer factories are built in Java: see config/Kafka*Config.java
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:insurance-app}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
